# Dedicated namespace with the strictest built-in Pod Security level.
# Kubernetes itself will REJECT any pod that is privileged, runs as root, etc.
apiVersion: v1
kind: Namespace
metadata:
  name: healthcare
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
